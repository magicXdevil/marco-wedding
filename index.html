<!DOCTYPE html>
<html lang="nl">

<head>

    <title>Lotte & Marco</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

        <p class="subtitle">

        </p>

        <p class="date">
            14 Juni 2028
        </p>

        <a href="#story" class="button">
            Bekijk onze dag
        </a>

        <div id="timer">

            <div>

            </div>

            <div>

            <div>
