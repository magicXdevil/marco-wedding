<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotte & Marco</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <div class="overlay">

            <h1>Lotte & Marco</h1>

            <p class="subtitle">
                Wij gaan trouwen
            </p>

            <p class="date">
                13-05-2028
            </p>

            <a href="#countdown" class="button">
                Bekijk onze dag
            </a>

        </div>

    </section>

    <section id="countdown">

        <h2>Wij tellen af naar onze grote dag</h2>

        <div id="timer">

            <div>
                <span id="days">0</span>
                <p>Dagen</p>
            </div>

            <div>
                <span id="hours">0</span>
                <p>Uren</p>
            </div>

            <div>
                <span id="minutes">0</span>
                <p>Minuten</p>
            </div>

            <div>
                <span id="seconds">0</span>
                <p>Seconden</p>
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
