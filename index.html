<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotte & Marco | Trouwen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <div class="overlay">

            <h1>Lotte & Marco</h1>

            <p class="subtitle">
                Wij gaan trouwen
            </p>

            <p class="date">
                13 mei 2028
            </p>

            <a href="#story" class="button">
                Bekijk onze dag
            </a>

            <div id="timer">

                <div>
                    <span id="days">0</span>
                    <p>Dagen</p>
                </div>

                <div>
                    <span id="hours">0</span>
                    <p>Uren</p>
                </div>

                <div>
                    <span id="minutes">0</span>
                    <p>Minuten</p>
                </div>

                <div>
                    <span id="seconds">0</span>
                    <p>Seconden</p>
                </div>

            </div>

        </div>

    </section>

    <section id="story">

        <h2>Ons Verhaal</h2>

        <p>
            Welkom op onze trouwwebsite.
            Hier zullen wij binnenkort ons verhaal delen,
            foto's toevoegen en alle informatie over onze
            trouwdag bekend maken.
        </p>

    </section>

    <script src="script.js"></script>

</body>

</html>
